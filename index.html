<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Listy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Listy</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Lists">
        <header class="brand">
          <div class="brand-lockup">
            <img class="brand-logo" src="./logo.svg" alt="" />
            <div>
              <h1>Listy</h1>
            </div>
          </div>
          <div class="brand-actions">
            <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">Dark</button>
            <button class="icon-button mobile-only" id="toggle-lists" type="button" aria-label="Show lists">
              <span aria-hidden="true">Menu</span>
            </button>
          </div>
        </header>

        <nav class="section-nav" aria-label="Main sections">
          <button class="section-button active" id="show-lists" type="button">Lists</button>
          <button class="section-button" id="show-cards" type="button">Cards</button>
        </nav>

        <form class="new-list-form" id="new-list-form">
          <label for="new-list-name">New list</label>
          <div class="inline-form">
            <input id="new-list-name" name="name" type="text" placeholder="Weekend groceries" autocomplete="off" required />
            <button type="submit">Add</button>
          </div>
        </form>

        <nav class="list-nav" id="list-nav" aria-label="Saved lists"></nav>
      </aside>

      <main class="main-panel">
        <section class="empty-state" id="empty-state" hidden>
          <h2>No list selected</h2>
          <p>Create a list to start adding items.</p>
        </section>

        <section class="list-workspace" id="list-workspace" hidden>
          <header class="list-header">
            <div>
              <input id="list-name" class="list-title-input" type="text" autocomplete="off" />
            </div>
            <div class="header-actions">
              <button class="danger-button" id="delete-list" type="button">Delete list</button>
            </div>
          </header>

          <form class="item-form" id="item-form">
            <div class="quick-add-row">
              <input id="item-title" name="title" type="text" placeholder="Eggs" autocomplete="off" required />
              <button class="icon-button details-toggle" id="toggle-item-details" type="button" aria-label="Show optional item fields" aria-expanded="false">...</button>
              <button class="icon-button add-item-button" id="submit-item" type="submit" aria-label="Add item">+</button>
              <button class="ghost-button cancel-edit-button" id="cancel-edit" type="button" hidden>Cancel</button>
            </div>
            <div class="optional-fields" id="optional-fields" hidden>
              <input id="item-volume" name="volume" type="text" placeholder="Volume, e.g. 6" autocomplete="off" />
              <input id="item-due" name="dueDate" type="date" />
              <textarea id="item-description" name="description" rows="2" placeholder="Description"></textarea>
            </div>
          </form>

          <p class="status-message" id="status-message" hidden></p>

          <section class="item-section" aria-label="Open items">
            <div class="item-list" id="open-items"></div>
          </section>

          <section class="item-section done-section" aria-label="Done items">
            <div class="item-list" id="done-items"></div>
          </section>
        </section>

        <section class="cards-workspace" id="cards-workspace" hidden>
          <header class="cards-header">
            <h2>Cards</h2>
          </header>

          <form class="card-form" id="card-form">
            <div class="quick-add-row card-add-row">
              <input id="card-name" name="name" type="text" placeholder="Store card name" autocomplete="off" required />
              <input id="card-number" name="number" type="text" placeholder="Barcode number" autocomplete="off" />
              <button class="icon-button add-item-button" type="submit" aria-label="Save card">+</button>
            </div>
            <div class="card-upload-row">
              <input id="card-image" name="image" type="file" accept="image/*" />
              <p>Use a barcode number, an uploaded barcode image, or both.</p>
            </div>
          </form>

          <p class="status-message" id="card-status-message" hidden></p>

          <div class="cards-grid" id="cards-grid"></div>
          <div class="card-display" id="card-display" hidden>
            <div class="card-display-header">
              <h3 id="card-display-name"></h3>
              <button class="ghost-button" id="close-card-display" type="button">Close</button>
            </div>
            <div class="barcode-stage" id="barcode-stage"></div>
          </div>
        </section>
      </main>
    </div>

    <template id="list-button-template">
      <button class="list-button" type="button">
        <span class="list-button-name"></span>
        <span class="list-button-count"></span>
      </button>
    </template>

    <template id="item-template">
      <article class="item-card">
        <span class="swipe-hint" aria-hidden="true"></span>
        <label class="check-control">
          <input class="item-check" type="checkbox" />
          <span aria-hidden="true"></span>
        </label>
        <div class="item-copy">
          <span class="item-title"></span>
          <span class="item-subtitle"></span>
        </div>
        <div class="item-actions" hidden>
          <button class="ghost-button item-edit" type="button">Edit</button>
          <button class="ghost-button item-delete" type="button">Delete</button>
        </div>
      </article>
    </template>

    <template id="card-template">
      <article class="customer-card">
        <button class="customer-card-main" type="button">
          <span class="customer-card-name"></span>
          <span class="customer-card-number"></span>
        </button>
        <button class="ghost-button card-delete" type="button">Delete</button>
      </article>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
